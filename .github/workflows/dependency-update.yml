name: Dependency Updates

on:
  schedule:
    - cron: '0 3 * * 0'  # Weekly on Sunday 3 AM
  workflow_dispatch:

jobs:
  dependency-update:
    name: Update Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check for outdated packages
        run: npm outdated || true

      - name: Update dependencies (patch/minor)
        run: |
          npm update --save
          npm update --save-dev

      - name: Run tests after update
        run: npm run test
        env:
          DATABASE_URL: mysql://root:password@localhost:3306/bookstore_test
          REDIS_URL: redis://localhost:6379

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update dependencies'
          title: 'chore: weekly dependency updates'
          body: |
            Automated dependency updates from Dependabot schedule.
            
            This PR updates all dependencies to their latest compatible versions.
            Please review the changes and ensure tests pass before merging.
          branch: chore/dependency-updates
          delete-branch: true
          labels: dependencies, automated
          reviewers: ${{ github.actor }}